name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.1). Laisser vide pour incrémenter automatiquement.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Créer la release Web, PWA & Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Installation des dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Vérification des types
        run: npm run lint

      - name: Build de production Web
        run: npm run build

      - name: Déterminer la version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            PKG_VER=$(node -e "const fs = require('fs'); try { const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); process.stdout.write(String(p.version || '1.0.0').trim()); } catch(e) { process.stdout.write('1.0.0'); }")
            COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
            COMMITS_COUNT=$(echo "$COMMITS_COUNT" | tr -d '[:space:]')
            VERSION="${PKG_VER}.${COMMITS_COUNT}"
          fi
          # Nettoyer et valider le format de version (sans retours chariots ni espaces)
          CLEAN_VERSION=$(echo "$VERSION" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9._-]//g')
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "undefined" ] || [[ "$CLEAN_VERSION" == undefined* ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Créer l'archive zip Web pour déploiement
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          VER="${RELEASE_VERSION:-1.0.0}"
          cd dist && zip -r "../pos-module-web-${VER}.zip" . && cd ..

      - name: Synchroniser les assets avec le projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Création initiale de la plateforme Android Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: Rendre gradlew exécutable
        run: |
          chmod +x android/gradlew

      - name: Compiler les packages Android APK (Debug universel & Release)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon || echo "Note: Build release nécessite signature personnalisée"

      - name: Organiser et nommer les livrables APK et Web
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          VER="${RELEASE_VERSION:-1.0.0}"
          mkdir -p release-artifacts

          # Copier et nommer l'APK universel installable directement sur tout appareil Android
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/pos-module-pro-v${VER}.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/pos-module-pro-v${VER}-debug.apk"
          fi

          # Copier l'APK Release
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/pos-module-pro-v${VER}-release.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release-artifacts/pos-module-pro-v${VER}-release-unsigned.apk"
          fi

          # Déplacer l'archive Web
          cp "pos-module-web-${VER}.zip" release-artifacts/

          echo "Livrables préparés :"
          ls -lh release-artifacts/

      - name: Uploader les artefacts APK vers GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: pos-module-pro-android-apk-${{ steps.version.outputs.version }}
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publier la Release GitHub avec les fichiers APK et Web
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: POS Module Pro v${{ steps.version.outputs.version }}
          body: |
            ## 🍃 POS Module Pro — Version ${{ steps.version.outputs.version }}

            ### 📱 Application Android (APK)
            - **[pos-module-pro-v${{ steps.version.outputs.version }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/pos-module-pro-v${{ steps.version.outputs.version }}.apk)** : APK installable directement sur smartphones, tablettes et terminaux POS Android de caisse.
            - **pos-module-pro-v${{ steps.version.outputs.version }}-release.apk** : Version release optimisée.

            ### 🌐 Application Web & PWA
            - **pos-module-web-${{ steps.version.outputs.version }}.zip** : Fichiers statiques prêts pour hébergement Cloud ou serveur local (Apache / Nginx).

            ### ⚡ Caractéristiques
            - Moteur hors-ligne IndexedDB O(1)
            - Impression thermique 80 mm ESC/POS
            - Scanner caméra & lecteurs code-barres USB/Bluetooth
            - Réplication décentralisée PostgreSQL / Supabase
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
