name: Release Android (APK + AAB signés)

# Pipeline aligné sur le modèle CyberScrape :
#   version -> build/signature -> publication GitHub Releases
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version de release (ex: 1.0.1). Vide = 1.0.<run_number>."
        required: false
        type: string
        default: ""
      version_code:
        description: "versionCode Android (entier croissant). Vide = numéro de run."
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publier les artefacts sur GitHub Releases."
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Calculer la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déterminer version, versionCode et tag
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          else
            BASE_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
            MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
            VERSION="${MAJOR_MINOR}.${RUN_NUMBER}"
            TAG="v${VERSION}"
          fi

          # Nettoyage strict : pas d'espaces, slash ni caractère exotique dans le tag
          VERSION=$(echo "$VERSION" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9._-]//g')
          if [[ -z "$VERSION" || "$VERSION" == *".."* ]]; then
            echo "::error::Version invalide : '$VERSION'"
            exit 1
          fi
          TAG="v${VERSION}"

          VERSION_CODE="${INPUT_VERSION_CODE:-$RUN_NUMBER}"
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode invalide : '$VERSION_CODE' (entier attendu)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release : $VERSION (versionCode $VERSION_CODE, tag $TAG)"

  build:
    name: Build, signature et publication
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8 / AGP 8.13 compilent en Java 21 : JDK 17 provoquait "invalid source release: 21"
      - name: Configuration Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installation des dépendances NPM
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit || npm install --legacy-peer-deps --no-audit
          else
            npm install --legacy-peer-deps --no-audit
          fi

      - name: Vérification TypeScript
        run: npm run lint

      - name: Build Web de production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Synchronisation Capacitor (android)
        run: |
          npx cap sync android
          chmod +x android/gradlew

      - name: Préparer le keystore de signature (GitHub Secrets)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret GitHub manquant : $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configurez les secrets Android avant de relancer (voir GITHUB_SECRETS_SETUP.md)."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

          # Valide réellement le keystore et l'alias avant de lancer Gradle
          keytool -list -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore valide (alias: $KEY_ALIAS)."

      - name: Compiler l'APK et l'AAB release signés
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Vérifier la signature et l'identité du certificat
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          [ -f "$APK" ] || { echo "::error::APK release absent"; exit 1; }
          [ -f "$AAB" ] || { echo "::error::AAB release absent"; exit 1; }

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          EXPECTED=$(keytool -list -v -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::L'APK n'est pas signé avec le keystore attendu (attendu=$EXPECTED, obtenu=$ACTUAL)"
            exit 1
          fi
          echo "Certificat APK conforme : SHA-256 $EXPECTED"

          JARSIGNER_OUTPUT=$(jarsigner -verify "$AAB")
          echo "$JARSIGNER_OUTPUT"
          grep -q "jar verified" <<< "$JARSIGNER_OUTPUT" \
            || { echo "::error::Signature AAB invalide"; exit 1; }
          echo "Signature AAB vérifiée."

      - name: Préparer les livrables et les empreintes SHA-256
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
            "release-artifacts/pos-module-pro-v${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "release-artifacts/pos-module-pro-v${VERSION}.aab"
          (cd dist && zip -qr "../pos-module-web-v${VERSION}.zip" .)
          mv "pos-module-web-v${VERSION}.zip" release-artifacts/

          (cd release-artifacts && sha256sum ./* > SHA256SUMS.txt)
          ls -lh release-artifacts/
          cat release-artifacts/SHA256SUMS.txt

      - name: Archiver les livrables dans le workflow
        uses: actions/upload-artifact@v4
        with:
          name: pos-module-pro-v${{ needs.version.outputs.version }}
          path: release-artifacts/
          retention-days: 30

      - name: Publier la release GitHub officielle
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: POS Module Pro v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-artifacts/*
          body: |
            ## POS Module Pro v${{ needs.version.outputs.version }}

            ### Application Android signée
            - **pos-module-pro-v${{ needs.version.outputs.version }}.apk** — APK release signé (v1 + v2), installable directement.
            - **pos-module-pro-v${{ needs.version.outputs.version }}.aab** — Android App Bundle signé, prêt pour Google Play Console.

            ### Web
            - **pos-module-web-v${{ needs.version.outputs.version }}.zip** — build statique de production.
            - Application en ligne : https://connacri.github.io/MARKETPOS/

            ### Vérification
            - **SHA256SUMS.txt** — empreintes SHA-256 de chaque livrable.
            - Signature vérifiée par `apksigner` et `jarsigner` dans la CI.
            - `versionCode` : `${{ needs.version.outputs.version_code }}`

            _Build automatique depuis le commit ${{ github.sha }}._

      # Le keystore ne doit jamais rester sur le runner, même en cas d'échec
      - name: Supprimer le keystore temporaire
        if: always()
        shell: bash
        run: |
          rm -f android/app/release.keystore
          rm -rf "$RUNNER_TEMP/keystore" 2>/dev/null || true
