name: Deploy & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de release (ex: 1.0.1). Laisser vide pour incrémentation automatique.'
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Génération Release Android (APK/AAB signés) & Mise à jour Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Installation des dépendances NPM
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Validation et typage TypeScript
        run: npm run lint

      - name: Build Web de production
        run: npm run build

      - name: Déterminer la version de release
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            PKG_VER=$(node -e "const fs = require('fs'); try { const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); process.stdout.write(String(p.version || '1.0.0').trim()); } catch(e) { process.stdout.write('1.0.0'); }")
            COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
            COMMITS_COUNT=$(echo "$COMMITS_COUNT" | tr -d '[:space:]')
            VERSION="${PKG_VER}.${COMMITS_COUNT}"
          fi
          # Nettoyer et valider le format de version
          CLEAN_VERSION=$(echo "$VERSION" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9._-]//g')
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "undefined" ] || [[ "$CLEAN_VERSION" == undefined* ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Créer l'archive zip Web pour déploiement serveur / Cloud
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          VER="${RELEASE_VERSION:-1.0.0}"
          cd dist && zip -r "../pos-module-web-${VER}.zip" . && cd ..

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléversement de l'artefact Web pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Mise à jour et déploiement du site Web sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Synchronisation avec le projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Initialisation du dossier Android Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: Configuration et décodage du Keystore Android (Secrets GitHub)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'SherwoodPos2026SecretKey!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'marketpos' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'SherwoodPos2026SecretKey!' }}
        run: |
          set -eo pipefail
          mkdir -p android/app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Décodage du Keystore release officiel depuis les secrets GitHub..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          elif [ -f "android/app/release.keystore" ]; then
            echo "Keystore local existant détecté."
          else
            echo "Génération de secours d'un Keystore release PKCS12 / RSA 2048..."
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Connacri MARKETPOS, OU=POS Division, O=Connacri, L=Algiers, ST=Algiers, C=DZ"
          fi
          ls -lh android/app/release.keystore

      - name: Rendre gradlew exécutable
        run: |
          chmod +x android/gradlew

      - name: Compilation des applications Android (APK signé & AAB Google Play)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'SherwoodPos2026SecretKey!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'marketpos' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'SherwoodPos2026SecretKey!' }}
        run: |
          echo "=== 1. Génération de l'APK Release signé ==="
          ./gradlew assembleRelease --no-daemon

          echo "=== 2. Génération du bundle AAB Release signé (Google Play Store) ==="
          ./gradlew bundleRelease --no-daemon

          echo "=== 3. Génération de l'APK Debug pour tests locaux ==="
          ./gradlew assembleDebug --no-daemon

      - name: Préparation et organisation des livrables
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          VER="${RELEASE_VERSION:-1.0.0}"
          mkdir -p release-artifacts

          # 1. APK signé Release
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/pos-module-pro-v${VER}.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/pos-module-pro-v${VER}-signed-release.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release-artifacts/pos-module-pro-v${VER}-unsigned.apk"
          fi

          # 2. Android App Bundle (AAB) signé pour Google Play Store
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/pos-module-pro-v${VER}-signed.aab"
            cp android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/pos-module-pro-v${VER}.aab"
          fi

          # 3. APK universel Debug
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/pos-module-pro-v${VER}-debug.apk"
          fi

          # 4. Archive Web complète
          if [ -f "pos-module-web-${VER}.zip" ]; then
            cp "pos-module-web-${VER}.zip" release-artifacts/
          fi

          echo "Livrables prêts pour publication :"
          ls -lh release-artifacts/

      - name: Sauvegarder les artefacts dans GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: pos-module-pro-artifacts-${{ steps.version.outputs.version }}
          path: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/*.zip
          retention-days: 30

      - name: Publier la Release GitHub officielle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: POS Module Pro v${{ steps.version.outputs.version }}
          body: |
            ## 🍃 POS Module Pro — Version ${{ steps.version.outputs.version }}

            ### 📱 Application Android signée (Production & Store)
            - **[pos-module-pro-v${{ steps.version.outputs.version }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/pos-module-pro-v${{ steps.version.outputs.version }}.apk)** : APK Release officiel signé pour smartphones, tablettes et caisses enregistreuses Android.
            - **[pos-module-pro-v${{ steps.version.outputs.version }}-signed.aab](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/pos-module-pro-v${{ steps.version.outputs.version }}-signed.aab)** : Android App Bundle (AAB) signé prêt pour soumission sur **Google Play Store**.
            - **pos-module-pro-v${{ steps.version.outputs.version }}-debug.apk** : Version debug pour développeurs et bancs de tests.

            ### 🌐 Déploiement Web & PWA
            - **Application en ligne :** [Ouvrir l'application sur GitHub Pages](${{ steps.deployment.outputs.page_url }})
            - **pos-module-web-${{ steps.version.outputs.version }}.zip** : Fichiers statiques complets prêts pour hébergement Web / On-Premise.

            ### 🔐 Informations de signature
            - Signature Keystore PKCS12 / RSA 2048 avec v1 et v2
            - Configuré via les secrets GitHub `ANDROID_KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
